<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ez-sequence</title>
<meta name="description" content="Mermaid sequence diagrams rendered in the browser, with the participant row pinned while you scroll.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #d9dce1; --fg: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --accent-fg: #fff; --canvas: #e9ebef; --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1e2126; --border: #30343b; --fg: #e6e8eb; --muted: #9aa1ab;
      --accent: #3b82f6; --canvas: #101215; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---- top bar ---- */
  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .bar h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; white-space: nowrap; }
  .bar label { color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  select, button {
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
    color: var(--fg); font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .group { display: inline-flex; align-items: center; gap: 4px; }
  .group button { padding: 5px 8px; }
  .spacer { flex: 1; }
  #zoomPct, #fsPct { min-width: 44px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- full screen (Fullscreen API, or a fixed-position fallback) ---- */
  /* Rules kept separate: a browser without :fullscreen would otherwise drop the whole selector list. */
  #canvas:fullscreen { background: var(--canvas); }
  #canvas.fs-fallback { position: fixed; inset: 0; z-index: 50; background: var(--canvas); }
  #fsBar {
    display: none; position: fixed; right: 16px; bottom: 16px; z-index: 60;
    align-items: center; gap: 4px; padding: 6px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  #canvas:fullscreen #fsBar { display: flex; }
  #canvas.fs-fallback #fsBar { display: flex; }
  #fsBar .hintkey { color: var(--muted); font-size: 11px; margin: 0 4px; }

  /* ---- window-wide file drop ---- */
  #dropOverlay {
    display: none; position: fixed; inset: 0; z-index: 100; pointer-events: none;
    align-items: center; justify-content: center; background: rgba(37, 99, 235, .12);
    border: 3px dashed var(--accent); font-size: 18px; color: var(--fg);
  }
  #dropOverlay.show { display: flex; }
  #dropOverlay span { background: var(--panel); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border); }

  /* ---- main split ---- */
  main { flex: 1; display: flex; min-height: 0; }
  #editorPane {
    width: 420px; min-width: 240px; max-width: 75vw; resize: horizontal; overflow: hidden;
    display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel);
  }
  body.editor-hidden #editorPane { display: none; }
  textarea {
    flex: 1; width: 100%; border: 0; resize: none; padding: 10px 12px; outline: none;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: transparent; color: var(--fg); white-space: pre; tab-size: 2;
  }
  textarea[hidden] { display: none; }
  /* CodeMirror host (replaces the textarea once the editor modules load) */
  #editorHost { flex: 1; min-height: 0; overflow: hidden; }
  #editorHost[hidden] { display: none; }
  #editorHost .cm-editor { height: 100%; font-size: 12.5px; }
  #editorHost .cm-editor.cm-focused { outline: none; }
  #editorHost .cm-scroller { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.5; }
  #status {
    padding: 6px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px;
    min-height: 29px; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #status.error { color: var(--danger); }

  /* ---- diagram canvas ---- */
  #canvas { flex: 1; overflow: auto; position: relative; background: var(--canvas); }
  #stage { position: relative; width: max-content; min-width: 100%; padding: 16px; }
  #spacer { height: 0; }
  #stickyWrap {
    position: sticky; top: 0; z-index: 2; display: none; overflow: hidden;
    background: var(--paper, #fff); transition: box-shadow .15s;
  }
  #stickyWrap.stuck { box-shadow: 0 6px 12px -6px rgba(0,0,0,.45), 0 1px 0 rgba(0,0,0,.12); }
  #stickyWrap svg, #diagram > svg { display: block; max-width: none !important; }
  #diagram > svg { position: relative; z-index: 1; background: var(--paper, #fff); }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<header class="bar">
  <h1>ez-sequence</h1>
  <button id="renderBtn" class="primary" title="Render (Ctrl/Cmd+Enter)">Render</button>
  <label><input type="checkbox" id="autoRender" checked> Auto</label>
  <label><input type="checkbox" id="stickyToggle" checked> Sticky header</label>
  <label>Theme
    <select id="theme">
      <option value="auto">auto</option>
      <option value="default">default</option>
      <option value="neutral">neutral</option>
      <option value="forest">forest</option>
      <option value="dark">dark</option>
      <option value="redux">redux</option>
      <option value="redux-color">redux-color</option>
      <option value="redux-dark">redux-dark</option>
      <option value="redux-dark-color">redux-dark-color</option>
    </select>
  </label>
  <span class="group">
    <button id="zoomOut" title="Zoom out">−</button>
    <span id="zoomPct">100%</span>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomFit" title="Fit diagram width to the view">Fit</button>
    <button id="zoomReset" title="Reset zoom to 100%">1:1</button>
  </span>
  <button id="fsBtn" title="Show only the diagram, full screen (Esc exits)">⛶ Full screen</button>
  <span class="spacer"></span>
  <button id="openBtn" title="Open a text file (or drop one anywhere on the page)">Open…</button>
  <input type="file" id="fileInput" accept=".mmd,.mermaid,.md,.txt,.puml,.plantuml,.pu,.iuml,.wsd,text/*" hidden>
  <button id="convertBtn" title="Convert the PlantUML sequence diagram in the editor to Mermaid (undo with Cmd/Ctrl+Z)">PlantUML → Mermaid</button>
  <button id="downloadBtn" title="Download the rendered SVG" disabled>SVG ↓</button>
  <button id="linkBtn" title="Copy a link that contains this diagram">Copy link</button>
  <button id="toggleEditor" title="Show / hide the editor">Editor</button>
</header>

<main>
  <section id="editorPane">
    <div id="editorHost" hidden></div>
    <textarea id="src" spellcheck="false" placeholder="sequenceDiagram&#10;  Alice->>Bob: hello"></textarea>
    <div id="status">Loading Mermaid…</div>
  </section>
  <section id="canvas">
    <div id="stage">
      <div id="spacer"></div>
      <div id="stickyWrap"></div>
      <div id="diagram"><div id="empty">Type a Mermaid sequence diagram on the left.</div></div>
    </div>
    <div id="fsBar">
      <button id="fsOut" title="Zoom out">−</button>
      <span id="fsPct">100%</span>
      <button id="fsIn" title="Zoom in">+</button>
      <button id="fsFit" title="Fit diagram width">Fit</button>
      <button id="fsExit" title="Exit full screen">Exit</button>
      <span class="hintkey">Esc</span>
    </div>
  </section>
</main>
<div id="dropOverlay"><span>Drop a text file, or dragged text, to open it</span></div>

<!-- PlantUML sequence → Mermaid converter (local file, no dependencies). -->
<script src="puml2mermaid.js"></script>

<!-- Mermaid runs entirely in the browser. CDN first; if that fails, fall back to a vendored copy (see README). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/12.3.0/mermaid.min.js"
        onerror="var s=document.createElement('script');s.src='vendor/mermaid.min.js';s.onload=function(){window.__ezBoot&&window.__ezBoot()};s.onerror=function(){window.__ezNoMermaid&&window.__ezNoMermaid()};document.head.appendChild(s)"></script>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const el = {
    src: $('#src'), editorHost: $('#editorHost'), status: $('#status'), canvas: $('#canvas'), stage: $('#stage'),
    spacer: $('#spacer'), stickyWrap: $('#stickyWrap'), diagram: $('#diagram'),
    renderBtn: $('#renderBtn'), autoRender: $('#autoRender'), stickyToggle: $('#stickyToggle'), theme: $('#theme'),
    zoomIn: $('#zoomIn'), zoomOut: $('#zoomOut'), zoomFit: $('#zoomFit'), zoomReset: $('#zoomReset'), zoomPct: $('#zoomPct'),
    openBtn: $('#openBtn'), fileInput: $('#fileInput'), downloadBtn: $('#downloadBtn'), linkBtn: $('#linkBtn'), convertBtn: $('#convertBtn'),
    toggleEditor: $('#toggleEditor'),
    fsBtn: $('#fsBtn'), fsOut: $('#fsOut'), fsIn: $('#fsIn'), fsPct: $('#fsPct'), fsFit: $('#fsFit'), fsExit: $('#fsExit'),
    dropOverlay: $('#dropOverlay'),
  };

  const LS = 'ez-sequence:';
  const STAGE_PAD = 16;
  const DARK_THEMES = new Set(['dark', 'redux-dark', 'redux-dark-color']);

  const SAMPLE = `---
title: Checkout flow (scroll down - the participant row stays pinned)
---
sequenceDiagram
  autonumber
  actor Customer
  box rgb(232, 240, 254) Edge
    participant Web as Web App
    participant GW as API Gateway
  end
  box rgb(232, 250, 236) Core services
    participant Orders as Order Service
    participant Inv as Inventory
    participant Pay as Payment
  end
  participant DB as Orders DB
  participant Bus as Event Bus

  Customer->>Web: Click "Place order"
  Web->>GW: POST /orders
  GW->>+Orders: createOrder(cart)
  Orders->>+Inv: reserve(items)
  Inv-->>-Orders: reservation id
  Orders->>DB: INSERT order (PENDING)
  DB-->>Orders: ok
  Orders->>+Pay: authorize(amount, card)
  Pay->>Pay: fraud screening
  Pay-->>-Orders: authorized
  Orders->>DB: UPDATE order (AUTHORIZED)
  Orders->>Bus: publish OrderAuthorized
  Orders-->>-GW: 201 Created
  GW-->>Web: order id
  Web-->>Customer: Show confirmation

  Note over Web,Bus: Fulfilment

  Bus->>+Inv: OrderAuthorized
  Inv->>Inv: pick & pack
  Inv->>Bus: publish OrderPacked
  deactivate Inv
  Bus->>Orders: OrderPacked
  Orders->>DB: UPDATE order (PACKED)
  Orders->>+Pay: capture(authorization)
  Pay-->>-Orders: captured
  Orders->>DB: UPDATE order (PAID)
  Orders->>Bus: publish OrderPaid
  Bus->>Web: OrderPaid (websocket)
  Web-->>Customer: "Your order is on its way"

  Note over Web,Bus: Edge cases

  Customer->>Web: Cancel order
  Web->>GW: DELETE /orders/{id}
  GW->>+Orders: cancel(id)
  Orders->>DB: SELECT order
  DB-->>Orders: PAID
  alt not yet shipped
    Orders->>Pay: refund(amount)
    Pay-->>Orders: refunded
    Orders->>Inv: release(items)
    Orders->>DB: UPDATE order (CANCELLED)
    Orders-->>GW: 200 OK
  else already shipped
    Orders-->>GW: 409 Conflict
  end
  deactivate Orders
  GW-->>Web: result
  Web-->>Customer: Show status
`;

  const state = {
    zoom: 1, sticky: true, theme: 'auto',
    svgText: '', vb: { x: 0, y: 0, w: 0, h: 0 }, head: null, main: null, clone: null, ready: false,
  };

  // ---------- persistence ----------
  const load = (k, d) => { try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} };

  // ---------- share links: #z=<base64url(deflate-raw(utf8))> or #s=<base64url(utf8)> ----------
  const b64url = {
    enc: (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
    dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)),
  };
  async function encodeHash(text) {
    const bytes = new TextEncoder().encode(text);
    if (typeof CompressionStream === 'function') {
      try {
        const cs = new CompressionStream('deflate-raw');
        const w = cs.writable.getWriter(); w.write(bytes); w.close();
        return 'z=' + b64url.enc(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
      } catch {}
    }
    return 's=' + b64url.enc(bytes);
  }
  async function decodeHash(hash) {
    const m = /^#?(z|s)=(.+)$/.exec(hash || '');
    if (!m) return null;
    try {
      const bytes = b64url.dec(m[2]);
      if (m[1] === 's') return new TextDecoder().decode(bytes);
      const ds = new DecompressionStream('deflate-raw');
      const w = ds.writable.getWriter(); w.write(bytes); w.close();
      return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
    } catch { return null; }
  }

  // ---------- Mermaid ----------
  function effectiveTheme() {
    if (state.theme !== 'auto') return state.theme;
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
  }
  function configureMermaid() {
    const theme = effectiveTheme();
    window.mermaid.initialize({
      startOnLoad: false,
      theme,
      securityLevel: 'strict',
      suppressErrorRendering: true,
      sequence: { useMaxWidth: false },
    });
    const paper = DARK_THEMES.has(theme) ? '#1e1e1e' : '#ffffff';
    document.documentElement.style.setProperty('--paper', paper);
  }

  let renderSeq = 0;
  async function render() {
    if (!state.ready) return;
    clearTimeout(timer);                 // an explicit render cancels any pending auto-render
    const text = editor.value;
    if (!text.trim()) { setStatus('Nothing to render.'); return; }
    const seq = ++renderSeq;
    const t0 = performance.now();
    try {
      const { svg } = await window.mermaid.render(`ez-${Date.now()}-${seq}`, text);
      if (seq !== renderSeq) return; // superseded by a newer render
      showSvg(svg);
      const ms = Math.round(performance.now() - t0);
      const n = state.main.querySelectorAll('line.actor-line').length;
      const kind = state.head ? 'sticky header on' : (state.sticky ? 'no participant row found, sticky header off' : 'sticky header off');
      setStatus(`Rendered ${Math.round(state.vb.w)}×${Math.round(state.vb.h)} in ${ms} ms · ${n} participant${n === 1 ? '' : 's'} · ${kind}`);
    } catch (err) {
      if (seq !== renderSeq) return;
      setStatus(String(err && err.message || err).trim(), true); // keep the last good diagram on screen
    }
  }

  function showSvg(svgText) {
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    if (doc.querySelector('parsererror')) throw new Error('Mermaid returned invalid SVG.');
    const svg = document.importNode(doc.documentElement, true);

    const vb = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    let box;
    if (vb.length === 4 && vb.every(Number.isFinite)) box = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
    else {
      const w = parseFloat(svg.getAttribute('width')) || 800, h = parseFloat(svg.getAttribute('height')) || 600;
      box = { x: 0, y: 0, w, h }; svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    }
    // Mermaid's own CSS inside the SVG is scoped by the element id, so the id must stay (and is duplicated on the clone).
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.maxWidth = 'none';
    svg.setAttribute('preserveAspectRatio', 'xMinYMin meet');

    el.diagram.replaceChildren(svg);
    state.svgText = svgText; state.vb = box; state.main = svg;
    state.head = detectHeader(svg);       // needs the SVG in the DOM for getBBox()
    buildClone();
    layout();
    el.downloadBtn.disabled = false;
  }

  /**
   * The band of the SVG (in user units) that holds the participant heads.
   * bottom = where the topmost lifeline starts.
   * top    = topmost shape that lies entirely above that line. The diagram title is a bare <text>
   *          directly under the root, so it is skipped and scrolls away; box labels live in a <g>
   *          and are kept.
   */
  function detectHeader(svg) {
    let bottom = Infinity;
    for (const line of svg.querySelectorAll('line.actor-line')) {
      const y1 = parseFloat(line.getAttribute('y1')), y2 = parseFloat(line.getAttribute('y2'));
      if (Number.isFinite(y1) && Number.isFinite(y2)) bottom = Math.min(bottom, Math.min(y1, y2));
    }
    if (!Number.isFinite(bottom)) return null;

    let top = Infinity;
    for (const shape of svg.querySelectorAll('rect,ellipse,circle,path,polygon,polyline,text,image,line,foreignObject')) {
      if (shape.tagName === 'text' && shape.parentNode === svg) continue;   // title
      if (shape.classList.contains('actor-line')) continue;
      let b; try { b = shape.getBBox(); } catch { continue; }
      if (b.width === 0 && b.height === 0) continue;
      if (b.y + b.height <= bottom + 0.5) top = Math.min(top, b.y);
    }
    if (!Number.isFinite(top)) top = bottom - 65;
    return { top: Math.max(state.vb.y, top - 4), bottom: bottom + 1 };
  }

  function buildClone() {
    el.stickyWrap.replaceChildren();
    state.clone = null;
    if (!state.main || !state.head) return;
    const clone = state.main.cloneNode(true);
    el.stickyWrap.appendChild(clone);
    state.clone = clone;
  }

  function layout() {
    if (!state.main) return;
    const z = state.zoom, { x: vx, y: vy, w, h } = state.vb;
    const head = state.sticky ? state.head : null;
    state.main.style.width = `${w * z}px`;
    state.main.style.height = `${h * z}px`;
    showZoom();

    if (head && state.clone) {
      const hh = head.bottom - head.top;
      const offset = head.top - vy;                      // distance from the SVG's top edge to the band
      el.spacer.style.height = `${offset * z}px`;
      el.stickyWrap.style.display = 'block';
      el.stickyWrap.style.width = `${w * z}px`;
      el.stickyWrap.style.height = `${hh * z}px`;
      state.clone.setAttribute('viewBox', `${vx} ${head.top} ${w} ${hh}`);
      state.clone.style.width = `${w * z}px`;
      state.clone.style.height = `${hh * z}px`;
      // Pull the real diagram up underneath the clone so, before scrolling, both draw the same pixels.
      state.main.style.marginTop = `${-(offset + hh) * z}px`;
    } else {
      el.spacer.style.height = '0px';
      el.stickyWrap.style.display = 'none';
      state.main.style.marginTop = '0px';
    }
    updateStuck();
  }

  function updateStuck() {
    if (!state.head || !state.sticky) { el.stickyWrap.classList.remove('stuck'); return; }
    const stuck = el.canvas.scrollTop > STAGE_PAD + (state.head.top - state.vb.y) * state.zoom + 1;
    el.stickyWrap.classList.toggle('stuck', stuck);
  }

  function setStatus(msg, isError = false) {
    el.status.textContent = msg;
    el.status.classList.toggle('error', isError);
  }

  // ---------- zoom ----------
  function showZoom() {
    const pct = `${Math.round(state.zoom * 100)}%`;
    el.zoomPct.textContent = pct; el.fsPct.textContent = pct;
  }
  function setZoom(z) {
    state.zoom = Math.min(6, Math.max(0.1, z));
    save('zoom', state.zoom);
    layout();
  }
  function fitWidth() {
    if (!state.vb.w) return;
    setZoom((el.canvas.clientWidth - STAGE_PAD * 2) / state.vb.w);
  }
  const ZOOM_STEP = 1.2;
  el.zoomIn.addEventListener('click', () => setZoom(state.zoom * ZOOM_STEP));
  el.zoomOut.addEventListener('click', () => setZoom(state.zoom / ZOOM_STEP));
  el.zoomReset.addEventListener('click', () => setZoom(1));
  el.zoomFit.addEventListener('click', fitWidth);
  el.fsIn.addEventListener('click', () => setZoom(state.zoom * ZOOM_STEP));
  el.fsOut.addEventListener('click', () => setZoom(state.zoom / ZOOM_STEP));
  el.fsFit.addEventListener('click', fitWidth);

  // ---------- full screen ----------
  // Uses the Fullscreen API on the diagram pane (the browser handles Esc). Where the API is missing
  // (e.g. iPhone Safari) a fixed-position fallback is used and Esc is handled here.
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const inFullscreen = () => fsEl() === el.canvas || el.canvas.classList.contains('fs-fallback');
  async function enterFullscreen() {
    const req = el.canvas.requestFullscreen || el.canvas.webkitRequestFullscreen;
    if (req) {
      try { await req.call(el.canvas); return; } catch { /* fall through to the fallback */ }
    }
    el.canvas.classList.add('fs-fallback');
    syncFullscreen();
  }
  function exitFullscreen() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    el.canvas.classList.remove('fs-fallback');
    syncFullscreen();
  }
  function syncFullscreen() {
    const on = inFullscreen();
    el.fsBtn.textContent = on ? '⛶ Exit full screen' : '⛶ Full screen';
    updateStuck();
  }
  el.fsBtn.addEventListener('click', () => (inFullscreen() ? exitFullscreen() : enterFullscreen()));
  el.fsExit.addEventListener('click', exitFullscreen);
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && el.canvas.classList.contains('fs-fallback')) exitFullscreen();
  });
  el.canvas.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom(state.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });
  el.canvas.addEventListener('scroll', updateStuck, { passive: true });

  // ---------- editor ----------
  // CodeMirror 6 when its modules load (see the module script at the bottom); the plain textarea otherwise.
  let timer = null;
  let cm = null;
  const editor = {
    get value() { return cm ? cm.state.doc.toString() : el.src.value; },
    set value(v) {
      if (cm) cm.dispatch({ changes: { from: 0, to: cm.state.doc.length, insert: v } });  // undoable
      else el.src.value = v;
    },
  };
  function onSourceChanged() {
    save('src', editor.value);
    if (!el.autoRender.checked) return;
    clearTimeout(timer);
    timer = setTimeout(render, 500);
  }

  window.__ezAttachEditor = (lib) => {
    if (cm) return;
    const { EditorView, basicSetup, keymap, indentWithTab, mermaid: mermaidLang, oneDark, Compartment } = lib;
    const themeComp = new Compartment();
    const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
    cm = new EditorView({
      doc: el.src.value,
      extensions: [
        keymap.of([{ key: 'Mod-Enter', run: () => { render(); return true; } }, indentWithTab]),  // before basicSetup: wins over its Mod-Enter
        basicSetup,
        mermaidLang(),
        themeComp.of(dark() ? oneDark : []),
        EditorView.updateListener.of((u) => { if (u.docChanged) onSourceChanged(); }),
      ],
      parent: el.editorHost,
    });
    el.src.hidden = true;
    el.editorHost.hidden = false;
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      cm.dispatch({ effects: themeComp.reconfigure(dark() ? oneDark : []) });
    });
  };
  window.__ezEditorFailed = (err) => console.warn('CodeMirror did not load; using the plain textarea.', err);

  // Textarea fallback behaviour
  el.src.addEventListener('input', onSourceChanged);
  el.src.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); render(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      el.src.setRangeText('  ', el.src.selectionStart, el.src.selectionEnd, 'end');
      el.src.dispatchEvent(new Event('input'));
    }
  });
  el.renderBtn.addEventListener('click', render);
  el.autoRender.addEventListener('change', () => save('auto', el.autoRender.checked));
  el.stickyToggle.addEventListener('change', () => { state.sticky = el.stickyToggle.checked; save('sticky', state.sticky); layout(); });
  el.theme.addEventListener('change', () => { state.theme = el.theme.value; save('theme', state.theme); configureMermaid(); render(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'auto' && state.ready) { configureMermaid(); render(); } });
  el.toggleEditor.addEventListener('click', () => {
    document.body.classList.toggle('editor-hidden');
    save('editorHidden', document.body.classList.contains('editor-hidden'));
  });

  // Open file: button, or drop a file anywhere on the page
  el.openBtn.addEventListener('click', () => el.fileInput.click());
  el.fileInput.addEventListener('change', () => { if (el.fileInput.files[0]) loadFile(el.fileInput.files[0]); el.fileInput.value = ''; });

  // Accepts real files (Finder, Explorer) and dropped text (e.g. a selection dragged out of an editor).
  // Drags that start inside the page (moving text within the editor) are left alone.
  let internalDrag = false;
  window.addEventListener('dragstart', () => { internalDrag = true; });
  window.addEventListener('dragend', () => { internalDrag = false; });
  const droppable = (e) => {
    if (internalDrag || !e.dataTransfer) return false;
    const t = Array.from(e.dataTransfer.types || []);
    return t.includes('Files') || t.includes('text/plain') || t.includes('text/uri-list');
  };
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (!droppable(e)) return;
    e.preventDefault(); dragDepth++;
    el.dropOverlay.classList.add('show');
  });
  window.addEventListener('dragover', (e) => {
    if (!droppable(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', (e) => {
    if (!droppable(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el.dropOverlay.classList.remove('show');
  });
  window.addEventListener('drop', (e) => {
    if (!droppable(e)) return;
    e.preventDefault(); dragDepth = 0;
    el.dropOverlay.classList.remove('show');
    const dt = e.dataTransfer;
    const f = dt.files && dt.files[0];
    if (f) { loadFile(f); return; }
    const text = dt.getData('text/plain') || '';
    const uris = dt.getData('text/uri-list') || '';
    const looksLikePath = /^(file:\/\/|\/|~\/|[A-Za-z]:\\)\S*$/.test(text.trim());
    if (uris.trim() || looksLikePath) {
      // Editors like VS Code / Cursor drag a file *path*, not the file. A web page cannot read a local path.
      setStatus('That drag carried only a file path, which a web page cannot open. Drag the file from Finder/Explorer, drag the selected text instead, or use Open….', true);
      return;
    }
    if (text.trim()) loadText(text, 'dropped text');
  });

  const MAX_FILE = 2 * 1024 * 1024;
  async function loadFile(file) {
    if (file.size > MAX_FILE) { setStatus(`${file.name} is ${Math.round(file.size / 1024)} KB; files over 2 MB are not opened.`, true); return; }
    let txt;
    try { txt = await file.text(); } catch (err) { setStatus(`Could not read ${file.name}: ${err.message}`, true); return; }
    if (txt.includes('\u0000')) { setStatus(`${file.name} does not look like a text file.`, true); return; }
    await loadText(txt, file.name);
  }
  const PUML_EXT = /\.(puml|plantuml|pu|iuml|wsd)$/i;
  async function loadText(txt, label) {
    // Markdown: use the first ```mermaid fence if there is one.
    const m = /```mermaid\s*\n([\s\S]*?)```/.exec(txt);
    let src = (m ? m[1] : txt).replace(/^﻿/, '');
    let note = '';
    // PlantUML by extension or by @startuml: convert on the way in.
    if (window.pumlToMermaid && (PUML_EXT.test(label) || /@startuml/i.test(src))) {
      const r = window.pumlToMermaid(src);
      src = r.text;
      note = ` · converted from PlantUML${r.warnings.length ? `, ${r.warnings.length} line(s) kept as %% TODO` : ''}`;
    }
    editor.value = src; save('src', src);
    await render();
    if (!el.status.classList.contains('error')) setStatus(`Opened ${label}${note} · ${el.status.textContent}`);
  }

  // Convert whatever is in the editor from PlantUML to Mermaid, in place (undoable in CodeMirror).
  el.convertBtn.addEventListener('click', async () => {
    if (!window.pumlToMermaid) { setStatus('Converter not loaded (puml2mermaid.js is missing).', true); return; }
    const r = window.pumlToMermaid(editor.value);
    editor.value = r.text; save('src', r.text);
    await render();
    const warn = r.warnings.length ? ` · ${r.warnings.length} line(s) kept as %% TODO comments` : '';
    if (!el.status.classList.contains('error')) setStatus(`Converted PlantUML → Mermaid${warn} · ${el.status.textContent}`);
  });

  // Download rendered SVG
  el.downloadBtn.addEventListener('click', () => {
    if (!state.svgText) return;
    const blob = new Blob([state.svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: 'sequence.svg' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // Copy a self-contained link
  el.linkBtn.addEventListener('click', async () => {
    const hash = await encodeHash(editor.value);
    history.replaceState(null, '', '#' + hash);
    try { await navigator.clipboard.writeText(location.href); setStatus(`Link copied (${location.href.length} chars).`); }
    catch { setStatus('Link is in the address bar (clipboard access was denied).'); }
  });

  // ---------- boot ----------
  async function boot() {
    if (state.ready) return;
    if (!window.mermaid) return;
    state.ready = true;

    state.zoom = load('zoom', 1);
    state.sticky = load('sticky', true); el.stickyToggle.checked = state.sticky;
    state.theme = load('theme', 'auto'); el.theme.value = state.theme;
    el.autoRender.checked = load('auto', true);
    if (load('editorHidden', false)) document.body.classList.add('editor-hidden');
    showZoom();

    const fromHash = await decodeHash(location.hash);
    editor.value = fromHash !== null ? fromHash : load('src', SAMPLE);
    if (fromHash !== null) save('src', fromHash);

    configureMermaid();
    render();
  }
  window.__ezBoot = boot;
  window.__ezNoMermaid = () => setStatus('Could not load Mermaid from the CDN or from vendor/mermaid.min.js. See README for vendoring.', true);

  if (window.mermaid) boot();
  else window.addEventListener('load', () => { if (window.mermaid) boot(); });
})();
</script>

<!--
  CodeMirror 6 + Mermaid syntax highlighting, as ES modules.
  Every package is served by esm.sh with its dependencies left external ("*" prefix), and this import
  map resolves each bare specifier to exactly one URL, so all packages share a single @codemirror/state
  instance. If anything here fails to load, the page keeps working with the plain textarea.
-->
<script type="importmap">
{
  "imports": {
    "codemirror":                 "https://esm.sh/*codemirror@6.0.2",
    "codemirror-lang-mermaid":    "https://esm.sh/*codemirror-lang-mermaid@0.5.0",
    "@codemirror/state":          "https://esm.sh/*@codemirror/state@6.7.6",
    "@codemirror/view":           "https://esm.sh/*@codemirror/view@6.43.15",
    "@codemirror/language":       "https://esm.sh/*@codemirror/language@6.13.1",
    "@codemirror/commands":       "https://esm.sh/*@codemirror/commands@6.11.1",
    "@codemirror/search":         "https://esm.sh/*@codemirror/search@6.7.2",
    "@codemirror/autocomplete":   "https://esm.sh/*@codemirror/autocomplete@6.20.4",
    "@codemirror/lint":           "https://esm.sh/*@codemirror/lint@6.9.8",
    "@codemirror/theme-one-dark": "https://esm.sh/*@codemirror/theme-one-dark@6.1.3",
    "@lezer/common":              "https://esm.sh/*@lezer/common@1.5.5",
    "@lezer/highlight":           "https://esm.sh/*@lezer/highlight@1.2.5",
    "@lezer/lr":                  "https://esm.sh/*@lezer/lr@1.4.12",
    "style-mod":                  "https://esm.sh/*style-mod@4.1.4",
    "w3c-keyname":                "https://esm.sh/*w3c-keyname@2.2.8",
    "crelt":                      "https://esm.sh/*crelt@1.0.7"
  }
}
</script>
<script type="module">
  try {
    const [cmMod, viewMod, stateMod, cmdMod, langMod, darkMod] = await Promise.all([
      import('codemirror'),
      import('@codemirror/view'),
      import('@codemirror/state'),
      import('@codemirror/commands'),
      import('codemirror-lang-mermaid'),
      import('@codemirror/theme-one-dark'),
    ]);
    window.__ezAttachEditor({
      EditorView: viewMod.EditorView,
      keymap: viewMod.keymap,
      basicSetup: cmMod.basicSetup,
      Compartment: stateMod.Compartment,
      indentWithTab: cmdMod.indentWithTab,
      mermaid: langMod.mermaid,
      oneDark: darkMod.oneDark,
    });
  } catch (err) {
    window.__ezEditorFailed && window.__ezEditorFailed(err);
  }
</script>
</body>
</html>
